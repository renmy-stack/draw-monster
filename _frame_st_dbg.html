<!DOCTYPE html><html><body style="margin:0"><iframe id="f" style="width:390px;height:844px;border:0;display:block"></iframe><script>
const f=document.getElementById('f');f.src='index.html?gachatest&nocount';const log=[];
f.onload=()=>{const w=f.contentWindow;w.addEventListener('error',e=>log.push('ERR '+e.message));setTimeout(()=>{
const it=(r,n)=>({item:{r,name:n},dup:false});
w.KZStage.play({rs:[it(1,'a'),it(3,'b')],multi:true,onDone(){log.push('done');}});
[1000,2500,3000,3200,3600,4500,6000].forEach(ms=>setTimeout(()=>{log.push(ms+':'+w.KZStage.phase()+' '+w.KZStage.dbg());if(ms===3000){const c=w.document.querySelector('#kzstage canvas');c.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true}));log.push('tapped '+!!c);}},ms));
setTimeout(()=>{const o=document.createElement('pre');o.id='o';o.textContent=log.join(' | ');document.body.appendChild(o);},6500);
},300);};</script></body></html>
