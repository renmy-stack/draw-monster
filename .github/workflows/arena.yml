# アリーナの 相手リスト（arena.json）を 3 時間ごとに 作りなおす。Firebase を 読む 鍵は リポジトリの Secrets の FB_SECRET
name: arena
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: arena
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/arena_build.js
        env:
          FB_SECRET: ${{ secrets.FB_SECRET }}
      - run: |
          git config user.name "arena-bot"
          git config user.email "279485679+renmy-stack@users.noreply.github.com"
          git add arena.json arena_state.json
          git diff --cached --quiet || (git commit -m "アリーナ こうしん" && git push)
