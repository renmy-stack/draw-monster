# モンスター ランクせん: まだの 組み合わせを 総当たりで 計算して 勝率・順位を 書き戻す（tools/rank_batch.js）
# 管理の 合言葉は リポジトリの Secrets の RANK_ADMIN
name: rank
# 起動は Cloudflare の 受付係（renmy-rank）から（登録が あれば、15 分に 1 回まで・毎日 0:05）
on:
  workflow_dispatch:
permissions:
  contents: write   # 順位表の ファイルを board 枝へ
concurrency: rank
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 13   # 計算は ふだん 8 分 ＋ イベント 1.5 分まで（起動は 15 分に 1 回まで なので 次の 回と ぶつからない）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 計算ずみの 組み合わせ（.rankcache/pairs.json）を 前の 回から 引きつぐ
      - uses: actions/cache/restore@v4
        with:
          path: .rankcache
          key: rank-pairs-${{ github.run_id }}
          restore-keys: rank-pairs-
      - id: batch
        run: node tools/rank_batch.js
        env:
          RANK_ADMIN: ${{ secrets.RANK_ADMIN }}
      # きょうの イベント（1 日で 完結する ランクせん）。計算は 1.5 分まで。ふだんの ほうが 失敗しても 動かす
      - id: ev
        if: always()
        run: node tools/ev_batch.js
        env:
          RANK_ADMIN: ${{ secrets.RANK_ADMIN }}
          RANK_TIME: '90000'
      # 順位表の ファイル（top.json・evtop.json）を board 枝に 1 コミットで 上書き。ゲームは まず これを 読む（受付係への 通信を へらす）
      - if: always() && hashFiles('.board/*.json') != ''
        run: |
          cd .board
          # この 回で 書けなかった ファイル（計算の 失敗など）は いまの board 枝の ものを のこす（上書きで 消さない）
          for f in top.json evtop.json; do [ -f "$f" ] || curl -sfo "$f" "https://raw.githubusercontent.com/${{ github.repository }}/board/$f" || true; done
          git init -q -b board
          git add -A
          git -c user.name=rank-bot -c user.email=279485679+renmy-stack@users.noreply.github.com commit -qm "board $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" board
      # 新しい 組み合わせを 計算した ときだけ 保存（同じ 中身の キャッシュを 積み上げない）
      - if: always() && (steps.batch.outputs.changed == '1' || steps.ev.outputs.changed == '1')
        uses: actions/cache/save@v4
        with:
          path: .rankcache
          key: rank-pairs-${{ github.run_id }}
